<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.5" />
    </pattern>

    <!-- Filter for Glow effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrbs {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-25px) scale(1.08); }
      100% { transform: translateY(0px) scale(1); }
    }
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.2; stroke-dashoffset: 0; }
      50% { opacity: 0.7; stroke-dashoffset: 40; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes scanlineMove {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    .orb-anim-1 {
      animation: floatOrbs 9s ease-in-out infinite;
      transform-origin: center;
    }
    .orb-anim-2 {
      animation: floatOrbs 12s ease-in-out infinite reverse;
      transform-origin: center;
    }
    .badge-anim-1 {
      animation: floatBadge 5s ease-in-out infinite;
    }
    .badge-anim-2 {
      animation: floatBadge 6s ease-in-out infinite 1s;
    }
    .badge-anim-3 {
      animation: floatBadge 7s ease-in-out infinite 2s;
    }
    .beam-path {
      stroke-dasharray: 8 12;
      animation: pulseBeam 4s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-anim-1">
    <circle cx="180" cy="110" r="160" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  </g>
  <g class="orb-anim-2">
    <circle cx="1020" cy="300" r="180" fill="url(#glowGrad2)" filter="url(#softGlow)" />
    <circle cx="850" cy="90" r="130" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  </g>

  <!-- Animated Decorative Connecting Beams (Backdrop) -->
  <g opacity="0.6">
    <path class="beam-path" d="M 60 70 Q 300 20 600 70 T 1140 70" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <path class="beam-path" d="M 60 370 Q 350 410 650 360 T 1140 370" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed pristine visibility & high contrast -->
  
  <!-- Category Tag Banner -->
  <g transform="translate(420, 48)">
    <rect x="0" y="0" width="360" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
      CURATED ECOSYSTEM • 2026 EDITION
    </text>
  </g>

  <!-- Primary Headline Title -->
  <g transform="translate(600, 140)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      AI Content Creation &amp; Writing Assistants
    </text>
  </g>

  <!-- Subtitle / Mission Statement -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Production SaaS Workspaces, Autonomous Deep Research Agents &amp; Open-Source Self-Hosted Studios
    </text>
  </g>

  <g transform="translate(600, 215)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      AI Copywriting • SEO &amp; GEO Engine Optimization • Grammar Linters • Local LLM Runtimes • Markdown Publishing
    </text>
  </g>

  <!-- Interactive Dynamic Floating Feature Pills -->
  <g class="badge-anim-1" transform="translate(90, 270)">
    <rect width="210" height="48" rx="24" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="105" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e0f2fe">
      ✍️ AI Copywriting &amp; SEO
    </text>
  </g>

  <g class="badge-anim-2" transform="translate(330, 270)">
    <rect width="250" height="48" rx="24" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" />
    <text x="125" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e0e7ff">
      🔎 Autonomous Research Agents
    </text>
  </g>

  <g class="badge-anim-3" transform="translate(610, 270)">
    <rect width="230" height="48" rx="24" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" />
    <text x="115" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fae8ff">
      🦙 Local LLM Workspaces
    </text>
  </g>

  <g class="badge-anim-1" transform="translate(870, 270)">
    <rect width="240" height="48" rx="24" fill="url(#pillGrad1)" stroke="#f472b6" stroke-width="1.2" />
    <text x="120" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fce7f3">
      ⚡ Grammar &amp; Style Linters
    </text>
  </g>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(600, 365)">
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#334155" stroke-width="1" />
    <text text-anchor="middle" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
      PRIVACY-FIRST • SELF-HOSTABLE • DEVELOPER-CENTRIC • REGULARLY UPDATED
    </text>
  </g>
</svg>
